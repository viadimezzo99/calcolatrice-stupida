plugins {
    id 'com.android.application'
}

android {
    namespace 'com.calcolatricestupida'
    compileSdk 34

    defaultConfig {
        applicationId 'com.calcolatricestupida'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
